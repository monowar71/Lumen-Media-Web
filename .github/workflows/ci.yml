name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack dist
        if: github.event_name == 'push'
        run: tar -C dist -czf lumenmedia-web-dist.tar.gz .

      - name: Upload dist artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: lumenmedia-web-dist
          path: lumenmedia-web-dist.tar.gz
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lumenmedia-web:ci .

      - name: Save image
        if: github.event_name == 'push'
        run: docker save lumenmedia-web:ci | gzip > lumenmedia-web-image.tar.gz

      - name: Upload image artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: lumenmedia-web-image
          path: lumenmedia-web-image.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: lumenmedia-web-dist

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: lumenmedia-web-image

      - name: Rename assets
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            mv lumenmedia-web-dist.tar.gz "lumenmedia-web-${{ github.ref_name }}.tar.gz"
            mv lumenmedia-web-image.tar.gz "lumenmedia-web-image-${{ github.ref_name }}.tar.gz"
          else
            mv lumenmedia-web-dist.tar.gz lumenmedia-web-nightly.tar.gz
            mv lumenmedia-web-image.tar.gz lumenmedia-web-image-nightly.tar.gz
          fi
          ls -lah lumenmedia-web-*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Nightly' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && true || false }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            lumenmedia-web-*.tar.gz
            lumenmedia-web-image-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
